<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>☕ 커피 내기 게임</title>
<style>
:root{
  --bg1:#0f1226; --bg2:#171a3a; --bg3:#241a4a;
  --card:rgba(255,255,255,.06); --card-brd:rgba(255,255,255,.12);
  --txt:#f3f4ff; --sub:#a6a9d4;
  --grad:linear-gradient(135deg,#ff7eb3,#ff758c,#ff9a8b,#ffd76f,#7afcff,#a18cd1);
  --accent:#8b7dff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

/* ===== 기록 · 랭킹 (v2.3.0) ===== */
.logbtn{position:absolute;top:calc(var(--safe-top) + 10px);right:62px;z-index:6;
  background:var(--card);border:1px solid var(--card-brd);color:var(--txt);
  border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:800;}
.logtabs{display:flex;gap:6px;margin-bottom:10px;}
.logtabs button{flex:1;padding:9px 0;border-radius:12px;border:1px solid var(--card-brd);
  background:var(--card);color:var(--sub);font-size:13px;font-weight:800;}
.logtabs button.on{background:linear-gradient(135deg,#8b7dff,#ff7eb3);color:#fff;border-color:transparent;}
#logBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bot) + 16px);}
.logempty{color:var(--sub);font-size:13.5px;font-weight:700;text-align:center;
  line-height:1.8;padding:48px 10px;}
.ymrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;}
.ymchip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--card-brd);
  background:var(--card);color:var(--sub);font-size:12px;font-weight:800;}
.ymchip.on{background:#fff;color:#161a3a;border-color:#fff;}
/* 시상대 */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;
  padding:18px 4px 6px;}
.pod{flex:1;max-width:118px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.podcrown{font-size:28px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));}
.podname{font-size:14.5px;font-weight:900;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.podcnt{font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:2px;}
.podbar{width:100%;border-radius:12px 12px 4px 4px;display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:900;color:rgba(0,0,0,.45);
  box-shadow:0 8px 20px rgba(0,0,0,.35);}
.podbar.gold{background:linear-gradient(180deg,#ffe89a,#f7c33a);}
.podbar.silver{background:linear-gradient(180deg,#eef2f6,#b9c4d0);}
.podbar.bronze{background:linear-gradient(180deg,#f0c39a,#c8834a);}
.podbar.empty{background:rgba(255,255,255,.05);border:1px dashed var(--card-brd);}
.podlbl{font-size:11px;font-weight:800;color:var(--sub);}
.ranklist{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
.rankrow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--card-brd);border-radius:12px;padding:9px 12px;}
.rnum{width:22px;text-align:center;font-size:12px;font-weight:900;color:var(--sub);}
.rname{flex:1;font-size:14px;font-weight:800;}
.rcnt{font-size:12.5px;font-weight:800;color:var(--sub);}
/* 기록 목록 */
.loglist{display:flex;flex-direction:column;gap:4px;}
.logday{font-size:12px;font-weight:900;color:var(--sub);margin:12px 2px 4px;}
.logrow{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--card-brd);border-radius:11px;padding:8px 11px;}
.lgtime{font-size:12px;font-weight:800;color:var(--sub);width:42px;}
.lggame{flex:1;font-size:12.5px;font-weight:700;color:var(--txt);opacity:.85;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lgname{font-size:14px;font-weight:900;}
.logclear{width:100%;margin:18px 0 6px;padding:12px;border-radius:12px;
  border:1px solid rgba(255,120,140,.35);background:rgba(255,120,140,.10);
  color:#ff9aab;font-size:13px;font-weight:800;}
.logfoot{text-align:center;color:var(--sub);font-size:11px;font-weight:700;
  opacity:.7;padding:14px 0 6px;}
/* 월별 */
.myear{font-size:13px;font-weight:900;color:var(--sub);padding:4px 2px 10px;}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.mcell{background:var(--card);border:1px solid var(--card-brd);border-radius:13px;
  padding:10px 12px;min-height:66px;}
.mcell.off{opacity:.42;}
.mm{font-size:11.5px;font-weight:900;color:var(--sub);}
.mname{font-size:15px;font-weight:900;margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.mno{font-size:15px;font-weight:900;color:var(--sub);margin-top:3px;}
.mcnt{font-size:11px;font-weight:700;color:var(--sub);margin-top:2px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Pretendard',system-ui,-apple-system,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(1200px 600px at 15% -10%,rgba(122,252,255,.14),transparent 60%),
    radial-gradient(1000px 700px at 110% 10%,rgba(255,126,179,.16),transparent 55%),
    radial-gradient(900px 900px at 50% 120%,rgba(161,140,209,.18),transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-top) + 8px) 0 var(--safe-bot);max-width:560px;margin:0 auto;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:0 16px;
  animation:fade .35s ease;overflow:hidden;}
.screen.active{display:flex;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 2px 12px;min-height:44px;}
.back{width:40px;height:40px;border:none;border-radius:14px;background:var(--card);
  border:1px solid var(--card-brd);color:var(--txt);font-size:20px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.back:active{transform:scale(.92);}
.topbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px;flex:1;}
.chip{font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--card-brd);
  padding:6px 11px;border-radius:999px;font-weight:700;}

/* ---- home ---- */
.hero{padding:14px 6px 4px;}
.hero .logo{font-size:46px;line-height:1;filter:drop-shadow(0 6px 18px rgba(255,150,120,.4));}
.hero h1{margin:10px 0 4px;font-size:30px;font-weight:900;letter-spacing:-1px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 6s linear infinite;}
@keyframes shine{to{background-position:200% center}}
.hero p{margin:0;color:var(--sub);font-size:14px;font-weight:600;}
.hero .ver{margin-top:5px;font-size:10.5px;font-weight:700;color:var(--sub);opacity:.5;letter-spacing:.5px;}
.playerbar{margin:14px 6px 6px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--card-brd);border-radius:18px;padding:12px 14px;
  backdrop-filter:blur(10px);}
.playerbar .who{flex:1;min-width:0;}
.playerbar .who b{font-size:14px;}
.playerbar .who .list{color:var(--sub);font-size:12.5px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.playerbar button{border:none;background:linear-gradient(135deg,#7afcff,#8b7dff);color:#0b0e24;
  font-weight:800;font-size:13px;padding:10px 14px;border-radius:12px;flex:0 0 auto;}
.playerbar button:active{transform:scale(.94);}
.grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 6px 24px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;-webkit-overflow-scrolling:touch;}
.gcard{position:relative;border-radius:22px;padding:16px 14px 15px;min-height:130px;
  border:1px solid var(--card-brd);overflow:hidden;display:flex;flex-direction:column;
  justify-content:space-between;background:var(--card);backdrop-filter:blur(10px);
  transition:transform .12s;}
.gcard:active{transform:scale(.96);}
.gcard .em{font-size:38px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));}
.gcard .t{font-size:17px;font-weight:900;letter-spacing:-.5px;margin-top:6px;}
.gcard .d{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.35;}
.gcard .glow{position:absolute;inset:0;opacity:.5;pointer-events:none;}
.gcard.full{grid-column:1 / -1;min-height:96px;flex-direction:row;align-items:center;gap:14px;}
.gcard.full .em{font-size:40px;}
.gcard.full .txts{flex:1;}
.gcard .badge{position:absolute;top:10px;right:12px;font-size:9.5px;font-weight:800;
  background:rgba(255,255,255,.16);padding:3px 8px;border-radius:999px;letter-spacing:.3px;}

/* ---- players screen ---- */
.plist{flex:1;overflow-y:auto;padding:6px 4px 12px;-webkit-overflow-scrolling:touch;}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-brd);
  border-radius:16px;padding:8px 10px;margin-bottom:10px;}
.dot{width:26px;height:26px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.08);}
.prow input{flex:1;background:transparent;border:none;color:var(--txt);font-size:16px;font-weight:700;
  padding:8px 2px;outline:none;min-width:0;}
.prow .rm{width:34px;height:34px;border:none;border-radius:10px;background:rgba(255,90,120,.16);
  color:#ff8aa4;font-size:18px;flex:0 0 auto;}
.prow .rm:active{transform:scale(.9);}
/* ---- 인원 곱하기 스테퍼 (v1.5.0) : ×1 ~ ×9, 그 사람이 그 수만큼 게임에 들어간다 ---- */
.prow .mul{display:flex;align-items:center;flex:0 0 auto;overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid var(--card-brd);border-radius:11px;}
.prow .mul button{width:29px;height:32px;border:none;background:transparent;color:var(--txt);
  font-size:17px;font-weight:900;line-height:1;padding:0;}
.prow .mul button:active{background:rgba(255,255,255,.16);}
.prow .mul button[disabled]{opacity:.25;}
.prow .mul .n{min-width:31px;text-align:center;font-size:13.5px;font-weight:900;
  color:#ffd76f;font-variant-numeric:tabular-nums;}
.prow.multi{border-color:rgba(255,215,111,.35);background:rgba(255,215,111,.07);}
.slotinfo{font-size:11.5px;color:var(--sub);font-weight:700;text-align:center;
  margin:-2px 4px 8px;opacity:.85;}
.addrow{display:flex;gap:10px;margin:2px 4px 10px;}
.addrow button{flex:1;border:1px dashed var(--card-brd);background:var(--card);color:var(--txt);
  font-weight:800;font-size:15px;padding:14px;border-radius:16px;}
.addrow button:active{transform:scale(.97);}
.bigbtn{border:none;border-radius:18px;padding:16px;font-size:17px;font-weight:900;color:#0b0e24;
  background:linear-gradient(135deg,#ffd76f,#ff9a8b,#ff758c);margin:4px 4px 6px;
  box-shadow:0 10px 26px rgba(255,140,120,.32);}
.bigbtn:active{transform:scale(.98);}
.bigbtn.alt{background:linear-gradient(135deg,#7afcff,#8b7dff);}

/* ---- generic game host ---- */
.host{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;}
.stage{flex:1;position:relative;border-radius:22px;overflow:hidden;margin:2px 0 10px;
  background:rgba(0,0,0,.28);border:1px solid var(--card-brd);}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;
  /* ★ v2.9.3 — 룰렛을 손가락으로 튕겨 돌리므로 브라우저 기본 스크롤·핀치를 막는다.
     없으면 스와이프가 페이지 스크롤로 먹혀서 pointermove 가 중간에 끊긴다. */
  touch-action:none;}
.controls{display:flex;gap:10px;padding:0 2px 6px;}
.controls .bigbtn{flex:1;margin:0;}
.hint{text-align:center;color:var(--sub);font-size:12.5px;font-weight:600;padding:0 8px 8px;}
.rankbox{position:absolute;top:10px;right:10px;background:rgba(10,12,30,.55);backdrop-filter:blur(6px);
  border:1px solid var(--card-brd);border-radius:14px;padding:8px 10px;font-size:12px;font-weight:800;
  max-width:46%;pointer-events:none;}
.rankbox .r{display:flex;align-items:center;gap:6px;margin:2px 0;white-space:nowrap;}
.rankbox .r i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;font-style:normal;}

/* ---- winner modal ---- */
#winner{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:radial-gradient(60% 60% at 50% 40%,rgba(30,20,60,.72),rgba(8,8,20,.92));
  backdrop-filter:blur(6px);padding:24px;text-align:center;flex-direction:column;}
#winner.show{display:flex;animation:fade .3s ease;}
#winner .sub{color:var(--sub);font-weight:800;letter-spacing:2px;font-size:14px;margin-bottom:6px;}
#winner .congrats{font-size:clamp(38px,13vw,72px);font-weight:900;letter-spacing:6px;
  background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:shine 3s linear infinite;text-shadow:0 0 40px rgba(255,180,120,.2);}
#winner .coffee{font-size:66px;margin:10px 0 4px;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both,float 2.6s ease-in-out infinite 0.6s;}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
@keyframes float{50%{transform:translateY(-10px)}}
#winner .name{font-size:clamp(30px,9vw,46px);font-weight:900;margin:6px 0 2px;letter-spacing:-1px;}
#winner .msg{color:var(--txt);font-size:16px;font-weight:700;opacity:.92;margin-bottom:26px;}
#winner .wbtns{display:flex;gap:12px;width:100%;max-width:360px;}
#winner .wbtns button{flex:1;border:none;border-radius:16px;padding:15px;font-weight:900;font-size:16px;}
#winner .again{background:linear-gradient(135deg,#ffd76f,#ff758c);color:#0b0e24;}
#winner .home{background:var(--card);border:1px solid var(--card-brd)!important;color:var(--txt);}
#winner button:active{transform:scale(.96);}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;}

.soundtoggle{position:absolute;top:calc(var(--safe-top) + 10px);right:14px;z-index:5;
  width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--card-brd);
  color:var(--txt);font-size:16px;}
::-webkit-scrollbar{width:0;height:0;}

/* ================= 로딩(스플래시) 화면 =================
   splash.png 를 화면에 꽉 채우고(cover), 그 위에 투명 배경 logo.png 를 얹어
   커졌다 작아졌다 반복시킨다.
   ★ .sp-frame 이 핵심 — 배경을 background-size:cover 로 깔면 기기 화면비마다
     잘리는 위치가 달라져서 로고 위치가 어긋난다. 그래서 원본 비율(941:1672)을
     유지한 '틀'을 화면보다 크게 잡아 가운데 두고, 그 안에서 %로 배치한다.
     틀이 화면 밖으로 넘치는 부분은 #splash 의 overflow:hidden 이 잘라낸다. */
#splash{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#180d05;
  opacity:1;transition:opacity .3s ease;}   /* A카페 QR: .55s → .3s (3초 안에 열리게) */
#splash.gone{opacity:0;pointer-events:none;}
.sp-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100vw, 100vh * 941 / 1672);
  height:max(100vh, 100vw * 1672 / 941);}
.sp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;}
/* 아트워크에 이미 로고가 그려져 있어서, 그 자리만 흐리게 뭉갠 뒤 진짜 로고를 얹는다.
   가장자리는 마스크로 서서히 풀어야 네모난 자국이 안 남는다. */
.sp-soft{position:absolute;left:-15%;right:-15%;top:6%;height:60%;overflow:hidden;
  /* 마스크가 박스 '안쪽'(96%)에서 완전히 투명해져야 경계에 가로줄이 안 생긴다.
     좌우로 15%씩 넓혀 둔 건, 옆면 경계선을 화면 밖으로 밀어내기 위한 것. */
  -webkit-mask-image:radial-gradient(64% 52% at 50% 50%,#000 32%,rgba(0,0,0,.5) 66%,transparent 96%);
  mask-image:radial-gradient(64% 52% at 50% 50%,#000 32%,rgba(0,0,0,.5) 66%,transparent 96%);}
/* ★ backdrop-filter 를 쓰면 안 된다 — 스플래시 뒤에 있는 앱 화면(홈 카드 글자)까지
   같이 빨아들여 비쳐 보였다. 대신 같은 이미지를 한 장 더 깔고 filter:blur 로 뭉갠다.
   이 박스는 틀 높이의 50%이므로 안쪽 이미지는 height 200% / top -24% 여야 배경과 겹친다. */
.sp-soft img{position:absolute;left:11.538%;width:76.923%;height:166.667%;top:-10%;object-fit:fill;
  filter:blur(26px) brightness(.86) saturate(1.15);}
.sp-logo{position:absolute;left:50%;top:36.5%;width:80%;
  transform:translate(-50%,-50%) scale(1);
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  animation:spPulse 1.7s ease-in-out infinite;}
/* ★ 커졌다 작아졌다 — 중간에 살짝 더 머물게 해서 '숨쉬는' 느낌 */
@keyframes spPulse{
  0%  {transform:translate(-50%,-50%) scale(1.00);}
  45% {transform:translate(-50%,-50%) scale(1.085);}
  60% {transform:translate(-50%,-50%) scale(1.075);}
  100%{transform:translate(-50%,-50%) scale(1.00);}
}
@media (prefers-reduced-motion:reduce){ .sp-logo{animation:none;} }

/* ---- 로딩 게이지 (v1.5.0) ----
   실제 로딩은 순식간이라 이건 '연출'이다. 그래서 한 숫자도 건너뛰지 않고
   1%→100%를 전부 보여준 뒤에야 앱으로 들어간다(탭 스킵 없음).
   ★ .sp-frame 안이 아니라 #splash 직속에 둔다 — 프레임은 화면보다 크게 잡아
     잘라내는 틀이라, 그 안에 넣으면 게이지가 화면 밖으로 밀린다. */
.sp-load{position:absolute;left:50%;bottom:calc(11% + var(--safe-bot));transform:translateX(-50%);
  width:min(74%,340px);z-index:3;text-align:center;}
.sp-bar{position:relative;height:13px;border-radius:999px;overflow:hidden;
  background:rgba(0,0,0,.46);
  box-shadow:inset 0 2px 7px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.14);}
.sp-fill{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#ffd76f,#ff9a8b,#ff758c,#ffd76f);
  background-size:220% 100%;animation:spFlow 1.3s linear infinite;
  box-shadow:0 0 14px rgba(255,168,120,.8);
  transition:width .05s linear;}      /* 한 칸(1%)씩 딱딱 끊기지 않게 살짝만 흘린다 */
@keyframes spFlow{to{background-position:220% 0;}}
.sp-glint{position:absolute;right:0;top:0;bottom:0;width:22px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9));filter:blur(1.5px);}
.sp-pct{margin-top:10px;font-size:15px;font-weight:900;letter-spacing:.4px;color:#ffe9c9;
  text-shadow:0 2px 10px rgba(0,0,0,.75);font-variant-numeric:tabular-nums;}
.sp-tip{margin-top:3px;font-size:11.5px;font-weight:700;color:rgba(255,233,201,.6);

<script>
"use strict";
/* ============================================================
   ☕ 커피 내기 게임 — 완전 자체구현 (외부 의존성 0)
   ============================================================ */
/* ★ 버전 — 값을 바꿀 때마다 VERSION.md와 함께 올린다 */
const APP_VERSION="2.11.7";

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- palette ---------- */
const PALETTE=["#ff6b9d","#ffa06b","#ffd166","#8ce99a","#63e6be","#4dd4ff",
               "#748ffc","#b197fc","#f783ac","#ff8787","#69db7c","#3bc9db"];

/* ---------- players ---------- */
let players=[];
/* ★ v1.4.1 — 참가자 목록 1회 초기화.
   APK를 덮어 설치해도 앱 데이터(localStorage)는 남아서 예전에 썼 넣었던 이름이
   그대로 뜨다. 이 버전 표시가 없으면 한 번만 지우고(→ 기본 4명으로 돌아간다)
   표시를 남긴다. 다음부터는 사용자가 설정한 명단이 그대로 유지된다. */
/* ★ v2.9.2 — 키를 v200→v292 로 올렸다. 기본 명단을 빈 칸로 바꿨 판이라,
   예전 APK 위에 덮어 설치해도 저장된 옛 명단이 한 번은 지워져야 한다. */
const PLAYERS_RESET_KEY='cg_reset_v292';
function resetPlayersOnce(){
  try{
    if(!localStorage.getItem(PLAYERS_RESET_KEY)){
      localStorage.removeItem('cg_players');
      localStorage.setItem(PLAYERS_RESET_KEY,'1');
    }
  }catch(e){}
}
/* ★ v1.5.0 — 인원 곱하기(×N).
   같은 이름을 여러 번 손으로 넣지 않아도 되게, 참가자마다 mult(1~9)를 둔다.
   게임에 넘어가는 명단(validPlayers)에서 그 사람이 mult개로 펼쳐지므로
   사다리 칸·룰렛 조각·구슬·상자 차례가 그만큼 늘어나고 당첨 확률도 비례해 올라간다.
   ★ 총 칸 수 상한은 두지 않는다. 한때 16칸으로 묶었더니 "한 명 ×9, 다른 사람 ×5"
     같은 조합에서 더 못 올라가 막혔다. 사람은 12명, 곱은 9까지라 최대 108칸으로
     자연히 유계다. 대신 칸이 많아지면 사다리/룰렛 라벨이 스스로 줄어든다
     (ladderLabelMode / 룰렛 showLabel 참고). */
const MAX_MULT=9;
const multOf=p=>clamp(Math.round(p&&p.mult||1),1,MAX_MULT);
function loadPlayers(){
  resetPlayersOnce();
  try{players=JSON.parse(localStorage.getItem('cg_players')||'null');}catch(e){players=null;}
  /* ★ v2.9.2 — 기본 명단을 **빈 칸 두 줄**로 바꿨다.
     예전엔 사람 네 명이 박혀 있어 새로 쓰려면 먼저 지워야 했다.
     두 줄인 이유 — 게임 최소 인원이 2명이고, 삭제 버튼도 2줄은 남기기 때문에
     여기서만 0줄로 두면 양쪽 규칙이 엇갈린다.
     이름이 비어 있으면 validPlayers() 가 건너뛰므로
     홈 화면엔 "참가자를 추가해주세요" 가 뜼고, 게임을 누르면 설정으로 보낸다. */
  if(!Array.isArray(players)||players.length<2){
    players=[{name:"",mult:1},{name:"",mult:1}];
  }
  players.forEach((p,i)=>{if(!p.color)p.color=PALETTE[i%PALETTE.length];p.mult=multOf(p);});
  savePlayers();
}
function savePlayers(){
  players.forEach((p,i)=>{p.color=PALETTE[i%PALETTE.length];p.mult=multOf(p);});
  localStorage.setItem('cg_players',JSON.stringify(players));
}
/* 이름이 비지 않은 사람만, mult개씩 펼쳐서 돌려준다.
   펼친 복제본은 이름·색을 원본과 똑같이 쓴다 — 어차피 같은 사람이라 구분할 필요가 없고,
   숫자를 붙이면(김철수2) 사다리 칸 이름이 잘려서 오히려 못 읽는다.
   ★ 상한(MAX_SLOTS)에 걸렸을 때 앞에서부터 그냥 잘라내면 안 된다 — 앞사람이 자리를
     다 먹고 뒷사람이 게임에서 통째로 사라진다(실제로 ×7,×5,×4,×4 로 테스트하다 최지우가
     증발했다). 그래서 ① 모두에게 1칸씩 먼저 주고 ② 남은 자리를 추가분에
     라운드로빈으로 나눠 준다. */
/* ★ v2.0.0 — 펼친 복제본을 **섞는다**.
   예전엔 [철수,철수,철수,영희,영희,민수...] 처럼 같은 사람이 연달아 놓였다.
   사다리·룰렛은 칸 순서가 곧 화면 배치라, 커피 잔이 한쪽 끝에 있으면
   "저 끝 사람이 걸리겠네"가 시작하자마자 보인다 — ×N을 준 사람이 뭉쳐 있어서
   확률이 한 구역에 몰리기 때문이다. 섞어 놓으면 같은 사람의 칸이 흩어져
   어느 칸이 걸려도 누가 될지 미리 안 보인다. 당첨 확률(mult 비례)은 그대로다. */
/* ★ v2.9.0 — 단순히 섞기만 하면 **같은 이름이 우연히 이웃**한다.
   사다리에서 "내 이름 옆이 또 나" 인 칸이 붙어 있으면 그 구간은 결과가 뻔해져
   재미가 없다. 그래서 무작위로 섞되 **같은 사람이 옆자리에 오지 않도록** 깐다.
   방법: 사람별로 묶어 많은 순으로 정렬한 뒤 **짝수 자리부터 채우고 홀수 자리로
   넘어간다**(작업 스케줄링에서 쓰는 그 배치). 어떤 사람의 칸 수가 전체의 절반
   이하이면 이웃이 절대 안 생긴다.
   ※ 한 사람이 절반을 넘게 가져가면(예: 2명인데 ×9 vs ×1) 이웃을 피할 방법이
     수학적으로 없다. 그때는 최대한 흩뿌리는 것까지만 한다. */
function spreadShuffle(items,keyOf){
  const g=new Map();
  items.forEach(x=>{const k=keyOf(x);(g.get(k)||g.set(k,[]).get(k)).push(x);});
  const lists=[...g.values()];
  lists.forEach(shuffle);
  shuffle(lists);                                   // 같은 크기끼리는 순서도 무작위
  lists.sort((a,b)=>b.length-a.length);             // 많은 사람부터 (안정 정렬)
  const n=items.length, out=new Array(n);
  let i=0;
  for(const list of lists) for(const it of list){
    out[i]=it; i+=2; if(i>=n) i=1;
  }
  return out;
}
function validPlayers(){
  const out=[];
  players.forEach((p,i)=>{
    const nm=(p.name||'').trim(); if(!nm)return;
    const col=PALETTE[i%PALETTE.length], m=multOf(p);
    for(let k=0;k<m;k++) out.push({name:nm,color:col,src:i});
  });
  return spreadShuffle(out,x=>x.src);
}
/* 사람 수(이름 기준) — 화면 표시에만 쓴다 */
function headCount(){return players.filter(p=>(p.name||'').trim()).length;}

/* ---------- sound (WebAudio, no assets) ---------- */
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(freq=440,dur=.12,type="sine",vol=.18){
  if(!soundOn)return;const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination);
  const t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);
}
function tick(f){beep(f,.05,"square",.08);}
/* ---- 룰렛 핸 타격음 "팅" ----------------------------------------------
   진짜 경품 룰렛에서 나는 소리는 두 겹이다.
     ① 플래퍼(탄성 있는 얼빠대)가 핸을 긁는 **광대역 타격음** — 짧고 건조한 "탁".
     ② 핸과 플래퍼가 같이 울리는 **금속 링** — 1.5~3kHz 대에 서로 배수가
        아닌 부분음 두 개가 겹쳐야 종소리가 아닌 **쇠소리**로 들린다.
        (배수 관계로 쌓으면 오르골처럼 들려서 2.76배 같은 비정수를 쓴다)
   세게 도는 중엔 높고 크게, 느려지면 낮고 작게 — 그래야 '다다다다다닭 … 탁 … 탁'
   으로 감속이 귀에 들린다. delay 는 한 프레임에 여러 개가 지나갈 때 겹치지 않게 밀어 주는 값. */
function pinHit(v,delay){
  const c=ac();if(!c||!soundOn)return;
  const t=c.currentTime+(delay||0);
  const V=0.32+0.68*clamp(v,0,1);
  // ① 타격 트랜지언트 — 밴드패스로 좀힌 짧은 노이즈
  const sc=c.createBufferSource();sc.buffer=musNoise();
  const bp=c.createBiquadFilter();bp.type="bandpass";
  bp.frequency.value=2400+1200*v;bp.Q.value=1.2;
  const ng=c.createGain();
  ng.gain.setValueAtTime(.16*V,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.030);
  sc.connect(bp);bp.connect(ng);ng.connect(c.destination);
  sc.start(t);sc.stop(t+.05);
  // ② 금속 링 — 기음 + 비정수 배음. 매번 살짝 틀어야 기계적으로 안 들린다
  const f0=(1620+520*v)*(0.96+Math.random()*0.08);
  const parts=[[1,.150,.080],[2.76,.075,.052]];
  for(let i=0;i<parts.length;i++){
    const o=c.createOscillator(),og=c.createGain();
    o.type="triangle";o.frequency.setValueAtTime(f0*parts[i][0],t);
    og.gain.setValueAtTime(parts[i][1]*V,t);
    og.gain.exponentialRampToValueAtTime(.0001,t+parts[i][2]);
    o.connect(og);og.connect(c.destination);o.start(t);o.stop(t+parts[i][2]+.02);
  }
}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.2),i*110));}
function boom(){const c=ac();if(!c||!soundOn)return;const o=c.createOscillator(),g=c.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(220,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(30,c.currentTime+.5);o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(.35,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);
  o.start();o.stop(c.currentTime+.6);}


/* ---------- BGM (WebAudio 자체 생성 · 오디오 파일 0개) ----------
   게임 6종이 각각 다른 곡을 갖는다. 미리 만든 mp3가 아니라 16분음표마다
   오실레이터를 하나씩 찍어서 실시간으로 연주한다(에셋 0 규칙).
   setInterval(25ms)로 0.2초 앞을 미리 예약하는 lookahead 스케줄러 —
   requestAnimationFrame에 태우면 프레임이 밀릴 때 박자가 흔들린다. */
const MUS={id:null,timer:null,step:0,next:0,bus:null,noise:null,bpm:120,duck:1};
let musWanted=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);

function musBus(){                       // 음악 전용 버스(컴프레서로 묶어 SFX를 안 덮게)
  const c=ac();if(!c)return null;
  if(!MUS.bus){
    const g=c.createGain(),k=c.createDynamicsCompressor();
    g.gain.value=0.0001;
    k.threshold.value=-18;k.ratio.value=6;k.attack.value=.004;k.release.value=.18;
    g.connect(k);k.connect(c.destination);MUS.bus=g;
  }
  return MUS.bus;
}
function musNoise(){
  const c=ac();if(!c)return null;
  if(!MUS.noise){const n=c.sampleRate,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;MUS.noise=b;}
  return MUS.noise;
}
/* 음정 보이스: cut을 주면 로우패스(따뜻하게), det를 주면 살짝 어긋난 2번째 오실레이터(두껍게) */
function mV(t,midi,dur,type,vol,out,cut,det){
  const c=ac();if(!c)return;
  const g=c.createGain();
  if(cut){const f=c.createBiquadFilter();f.type="lowpass";
    f.frequency.setValueAtTime(cut,t);f.frequency.exponentialRampToValueAtTime(Math.max(180,cut*.4),t+dur);
    g.connect(f);f.connect(out);}else g.connect(out);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const f0=mtof(midi);
  for(const d of (det?[0,det]:[0])){
    const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0*(1+d),t);
    o.connect(g);o.start(t);o.stop(t+dur+.03);
  }
}
function mKick(t,out,v=.9,f0=150,f1=45,dur=.18){
  const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);
}
function mNz(t,out,dur,hp,v){            // 하이햇·박수·셰이커·째깍 전부 이걸로
  const c=ac();if(!c)return;const sc=c.createBufferSource();sc.buffer=musNoise();
  const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
  const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  sc.connect(f);f.connect(g);g.connect(out);sc.start(t);sc.stop(t+dur+.02);
}
function mSnare(t,out,v=.3){
  mNz(t,out,.14,1600,v);
  const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type="triangle";o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(120,t+.09);
  g.gain.setValueAtTime(v*.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+.1);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+.12);
}
function mTom(t,out,f,v=.4){
  const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.22);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+.3);
}

/* ---- 게임별 곡. play(s,t,o): s=16분음표 번호, t=예약 시각, o=출력 버스 ----
   b=마디 안 위치(0~15), bar=4마디 프레이즈 안 마디 번호. */
const TRACKS={
  /* 사다리타기 — 밝은 8비트. 통통 튀는 펜타토닉 (C장조).
     v2.9.3: 사다리 진행이 1.5초로 빨라져서 곡도 138→146으로 같이 올렸다.
     한 사람 타는 동안 한 프레이즈가 지나가야 "탔다" 하는 맺음이 생긴다. */
  ladder:{bpm:146,vol:.45,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, PEN=[0,2,4,7,9,12,9,7];
    if(b===0||b===6||b===10)mKick(t,o,.85);
    if(b===4||b===12)mSnare(t,o,.24);
    if(b%2===0)mNz(t,o,.035,7200,b%4===0?.13:.07);
    if(b===14)mNz(t,o,.07,5200,.13);                        // 프레이즈 끝 필인
    if(b%4===0)mV(t,[36,33,41,43][bar],.24,"triangle",.34,o,900);
    if(b%2===0)mV(t,72+PEN[((s>>1)+bar*3)%8],.16,"square",.11,o,3200);
  }},

  /* 룰렛 — v2.9.3 전면 교체. 예전엔 카지노 라운지풍이라 **효과음을 덮었다**.
     이제 휠이 도는 동안 '다다다닥' 핀 소리가 주인공이므로, 음악은 비켜서서
     ① 저음 펄스로 심장만 뛰고 ② 고음은 얇은 셰이커만 남긴다.
     대신 2·4박에 손뼉(clap)을 넣어 사람들이 모여 구경하는 느낌을 만든다.
     bpm 126→112: 느려야 핀 소리의 감속이 대비되어 들린다. */
  roulette:{bpm:112,vol:.30,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, HM=[0,3,7,10,12,10,7,3];
    if(b===0||b===10)mKick(t,o,.90,150,44,.20);
    if(b===8)mKick(t,o,.55,140,44,.16);
    if(b===4||b===12){mNz(t,o,.11,1900,.20);mNz(t+.012,o,.09,2300,.13);}  // 겹손뼉
    if(b%4===2)mNz(t,o,.025,9500,.055);                     // 얇은 셰이커
    if(b===0)mV(t,[28,28,31,26][bar],.72,"sawtooth",.20,o,420);  // 저음 펄스
    if(b===6||b===13)mV(t,64+HM[(s+bar*3)%8],.26,"sine",.085,o,0,.005);
  }},

  /* 마블레이스 — v2.9.3 "신나게". 152→168 BPM, 포온더플로어 + 오프비트 베이스.
     ① 오프비트 8분 베이스(b%4===2)가 들어가면 하우스처럼 굴러가 급해진다.
     ② 오픈하이햇을 매 마디 뒤에 넣어 앞으로 끌어당긴다.
     ③ 4마디마다 리드가 한 옥타브 위로 뛰어 '한 바퀴 돌았다'는 맺음을 준다. */
  marble:{bpm:168,vol:.38,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, MIN=[0,3,5,7,10,12,10,7];
    if(b%4===0)mKick(t,o,1.05,180,44);
    if(b===4||b===12)mSnare(t,o,.32);
    if(b%2===1)mNz(t,o,(b===7||b===15)?.11:.03,7400,(b===7||b===15)?.20:.085);
    if(b%4===2)mV(t,[38,38,41,36][bar],.11,"sawtooth",.26,o,1100);   // 오프비트 베이스
    if(b%4===0)mV(t,[26,26,29,24][bar],.20,"sawtooth",.22,o,500);    // 앵커 저음
    if(b===0||b===3||b===6||b===10||b===13)
      mV(t,(bar===3?74:62)+MIN[(s+bar)%8],.16,"square",.115,o,2800);
  }},

  /* 뽑기 상자 — 오르골. 느리고 귀엽게, 고음 사인 아르페지오 */
  box:{bpm:116,vol:.58,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, MAJ=[0,4,7,12,7,4];
    if(b===0||b===8)mKick(t,o,.55,120,50,.14);
    if(b===4||b===12)mNz(t,o,.05,5000,.11);                 // 우드블록
    if(b%2===0)mV(t,79+MAJ[((s>>1)+bar)%6],.44,"sine",.14,o,0,.006);
    if(b===0||b===10)mV(t,[48,45,53,50][bar],.32,"triangle",.22,o,800);
  }},

  /* 폭탄 돌리기 — v2.9.3 **확 쫄리게**. 150→178 BPM.
     ① 째깍을 16분 전체에 깔았다. 강약을 번갈아 줘서 달려가는 초침처럼 들린다.
     ② 베이스가 반음씩 내려가던 걸 **감7화음(0,3,6,9 반음)** 으로 바꿨다 —
        어느 음으로도 해결되지 않는 화음이라 계속 불안하고, 마디마다 조금씩
        더 조여드는 느낌을 준다.
     ③ 4마디째에 **트라이톤 경보**(두 음 반음 어긋난 사이렌)를 넣어 "터진다"를 예고한다.
     ④ 마디 끝 16분 스네어 굴림 — 카운트다운이 가까워지는 소리. */
  bomb:{bpm:178,vol:.54,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, DIM=[33,36,39,42];
    mNz(t,o,.018,11000,b%4===0?.16:.06);                    // 달리는 초침(16분 전부)
    if(b===0||b===6||b===9)mKick(t,o,1.0,190,38,.15);
    if(b===4||b===12)mSnare(t,o,.30);
    if(b===14||b===15)mSnare(t,o,.22);                      // 마디 끝 굴림
    if(b%2===0)mV(t,DIM[bar],.13,"sawtooth",.26,o,560);     // 감7 베이스
    if(bar===3&&(b===2||b===6||b===10)){                    // 트라이톤 경보
      mV(t,81,.16,"square",.13,o,2600);
      mV(t+.055,75,.16,"square",.13,o,2600);
    }
    if(b===6||b===14)mV(t,69-bar*2,.16,"square",.10,o,1800);
  }},

  /* 악어 이빨 — 정글 부족. 저음 드론 위에 톰·셰이커, 어둡고 오싹 */
  croc:{bpm:100,vol:.47,play(s,t,o){
    const b=s%16,bar=(s>>4)%4, PM=[0,3,5,6,7,10];
    if(b===0||b===7)mKick(t,o,1,110,36,.26);
    if(b===4)mTom(t,o,190,.34); if(b===10)mTom(t,o,150,.30); if(b===14)mTom(t,o,120,.34);
    if(b%2===1)mNz(t,o,.045,6000,.08);                      // 셰이커
    if(b===0)mV(t,29,1.15,"sawtooth",.18,o,300);            // 저음 드론
    if(b===2||b===6||b===11)mV(t,53+PM[(s+bar*2)%6],.28,"triangle",.15,o,1400);
  }}
};

function musSet(id){musWanted=id;musSync();}               // 화면이 원하는 곡 지정
function musSync(){                                        // 소리 토글/화면 변화에 맞춰 정리
  if(!soundOn||!musWanted){musHalt();return;}
  if(MUS.id===musWanted&&MUS.timer)return;
  musHalt();musBegin(musWanted);
}
function musHalt(){
  if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}
  const c=AC;if(c&&MUS.bus){MUS.bus.gain.cancelScheduledValues(c.currentTime);
    MUS.bus.gain.setTargetAtTime(.0001,c.currentTime,.08);}
  MUS.id=null;
}
function musBegin(id){
  const c=ac();if(!c||!TRACKS[id])return;
  if(c.state==="suspended")c.resume();
  const o=musBus();if(!o)return;
  MUS.id=id;MUS.step=0;MUS.bpm=TRACKS[id].bpm;MUS.duck=1;MUS.next=c.currentTime+.14;
  o.gain.cancelScheduledValues(c.currentTime);
  o.gain.setValueAtTime(.0001,c.currentTime);
  o.gain.setTargetAtTime(TRACKS[id].vol,c.currentTime+.05,.35);   // 페이드인
  MUS.timer=setInterval(musTick,25);
}
function musTick(){
  const c=AC;if(!c||!MUS.id){return;}
  const st=60/MUS.bpm/4;                                   // 16분음표 길이(초)
  while(MUS.next<c.currentTime+.2){
    try{TRACKS[MUS.id].play(MUS.step,MUS.next,MUS.bus);}catch(e){}
    MUS.next+=st;MUS.step++;
  }
}
/* 긴장 구간에서 음악만 낮춘다(효과음은 그대로) — 룰렛 뜸들이기에서 쓴다 */
function musDuck(m,ramp=.2){
  MUS.duck=m;const c=AC;
  if(!c||!MUS.id||!MUS.bus)return;
  MUS.bus.gain.cancelScheduledValues(c.currentTime);
  MUS.bus.gain.setTargetAtTime(TRACKS[MUS.id].vol*m,c.currentTime,ramp);
}

/* ---------- confetti ---------- */
const fx=$("#fx");const fxc=fx.getContext("2d");let fxParts=[],fxRAF=null;
function fxResize(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;
  fxc.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
addEventListener("resize",fxResize);fxResize();
function confetti(n=140){
  for(let i=0;i<n;i++)fxParts.push({x:innerWidth/2+rand(-40,40),y:innerHeight*.32,
    vx:rand(-9,9),vy:rand(-16,-4),g:rand(.28,.5),r:rand(4,9),
    c:pick(PALETTE),rot:rand(0,6.28),vr:rand(-.3,.3),life:rand(90,150),shape:Math.random()<.5?0:1});
  if(!fxRAF)fxLoop();
}
function fxLoop(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  fxParts=fxParts.filter(p=>p.life>0);
  for(const p of fxParts){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;p.vx*=.99;
    fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.rot);fxc.fillStyle=p.c;
    fxc.globalAlpha=clamp(p.life/40,0,1);
    if(p.shape===0)fxc.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);
    else{fxc.beginPath();fxc.arc(0,0,p.r,0,6.28);fxc.fill();}
    fxc.restore();
  }
  if(fxParts.length)fxRAF=requestAnimationFrame(fxLoop);else{fxRAF=null;fxc.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------- winner modal ---------- */
let winnerReplay=null;
/* ============================================================
   기록(로그) · 랭킹 — v2.3.0
   ------------------------------------------------------------
   ★ 시간은 **한국 표준시(KST)** 로 적는다. 외부 시간 서버는 쓰지 않는다
     (이 프로젝트 규칙: 외부 API·유료 서비스 금지). 대신 기기 시계를
     `Intl.DateTimeFormat(timeZone:'Asia/Seoul')` 로 변환해 저장·표시하므로,
     기기 시간대가 뭐로 잡혀 있든(해외 로밍이든) 항상 한국 시간으로 남는다.
     저장은 epoch ms 한 개만 — 나중에 어느 시간대로 다시 그리든 안전하다.
   ★ 저장소: localStorage 'cg_log' = [{t: ms, g: 게임id, n: 이름}, ...]
   ============================================================ */
const LOG_KEY='cg_log', LOG_MAX=3000;
const GAME_NAME={ladder:"사다리타기",roulette:"룰렛 돌리기",marble:"마블레이스",
                 box:"뽑기 상자",bomb:"폭탄 돌리기",croc:"악어 이빨"};
const GAME_EMO={ladder:"🔀",roulette:"🎡",marble:"🎱",box:"🎁",bomb:"💣",croc:"🐊"};

function logLoad(){
  try{const a=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function logSave(a){try{localStorage.setItem(LOG_KEY,JSON.stringify(a));}catch(e){}}
function logAdd(game,name){
  name=(name||'').trim(); if(!name)return;
  const a=logLoad();
  a.push({t:Date.now(),g:game,n:name});
  if(a.length>LOG_MAX)a.splice(0,a.length-LOG_MAX);
  logSave(a);
}
/* KST 로 쪼갠 날짜 조각 */
const KST_FMT=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',
  year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',
  weekday:'short',hour12:false});
function kst(ms){
  const p={};KST_FMT.formatToParts(new Date(ms)).forEach(x=>{p[x.type]=x.value;});
  /* ko-KR 은 24시를 '24'로 줄 때가 있다 — 0시로 되돌린다 */
  if(p.hour==='24')p.hour='00';
  return {y:+p.year,m:+p.month,d:+p.day,hh:p.hour,mm:p.minute,w:p.weekday};
}
const kstYM=(ms)=>{const k=kst(ms);return k.y*100+k.m;};

/* 이름별 당첨 횟수 — 많은 순 */
function tally(rows){
  const m=new Map();
  rows.forEach(r=>m.set(r.n,(m.get(r.n)||0)+1));
  return [...m.entries()].map(([n,c])=>({n,c})).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n));
}
const colorOf=(name)=>{
  const i=players.findIndex(p=>(p.name||'').trim()===name);
  return i>=0?PALETTE[i%PALETTE.length]:"#cfd4ff";
};

/* ---------- 화면 ---------- */
let logTab='rank', logYM=0;      // logYM: 0 = 전체, 아니면 YYYYMM
function renderLog(){
  const rows=logLoad().slice().sort((a,b)=>b.t-a.t);
  $("#logChip").textContent=rows.length+"건";
  $$("#logTabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===logTab));
  const body=$("#logBody");
  if(!rows.length){
    body.innerHTML=`<div class="logempty">아직 기록이 없어요.<br>게임을 한 판 하면 여기에 쌓입니다 ☕</div>`;
    return;
  }
  if(logTab==='rank')  body.innerHTML=viewRank(rows);
  if(logTab==='list')  body.innerHTML=viewList(rows);
  if(logTab==='month') body.innerHTML=viewMonth(rows);
  body.querySelectorAll("[data-ym]").forEach(b=>b.onclick=()=>{logYM=+b.dataset.ym;renderLog();});
  const clr=body.querySelector("#logClear");
  if(clr)clr.onclick=()=>{
    if(confirm("기록을 전부 지울까요? 되돌릴 수 없어요."))
      {logSave([]);renderLog();}
  };
}
/* 기간 선택 칩 (전체 / 최근 달들) */
function periodChips(rows){
  const yms=[...new Set(rows.map(r=>kstYM(r.t)))].sort((a,b)=>b-a).slice(0,12);
  const chip=(v,label)=>`<button class="ymchip${logYM===v?' on':''}" data-ym="${v}">${label}</button>`;
  return `<div class="ymrow">${chip(0,'전체')}${yms.map(v=>chip(v,`${(v%100)}월`)).join('')}</div>`;
}
const inPeriod=(r)=>!logYM||kstYM(r.t)===logYM;

/* ---------- 랭킹: 올림픽 시상대 ---------- */
function viewRank(all){
  const rows=all.filter(inPeriod);
  const t=tally(rows);
  if(!t.length)return periodChips(all)+`<div class="logempty">이 기간에는 기록이 없어요.</div>`;
  const podium=[t[1],t[0],t[2]];                     // 2등·1등·3등 순서로 놓는다
  /* ★ '금관/은관/동관' 글자는 뺐다 — 메달과 색만으로 충분히 읽히고,
     글자가 있으면 시상대 아래가 지저분해진다. */
  const meta=[{r:2,h:74,cl:'silver',crown:'🥈'},
              {r:1,h:104,cl:'gold',crown:'🥇'},
              {r:3,h:52,cl:'bronze',crown:'🥉'}];
  const cols=podium.map((p,i)=>{
    const m=meta[i];
    if(!p)return `<div class="pod"><div class="podbar empty" style="height:${m.h}px"></div></div>`;
    return `<div class="pod">
      <div class="podcrown ${m.cl}">${m.crown}</div>
      <div class="podname" style="color:${colorOf(p.n)}">${p.n}</div>
      <div class="podcnt">${p.c}회</div>
      <div class="podbar ${m.cl}" style="height:${m.h}px"><span>${m.r}</span></div>
    </div>`;
  }).join('');
  const rest=t.slice(3).map((p,i)=>`
    <div class="rankrow"><span class="rnum">${i+4}</span>
      <span class="rname" style="color:${colorOf(p.n)}">${p.n}</span>
      <span class="rcnt">${p.c}회</span></div>`).join('');
  return periodChips(all)+`
    <div class="podium">${cols}</div>
    ${rest?`<div class="ranklist">${rest}</div>`:''}
    <div class="logfoot">총 ${rows.length}회 · 한국 시간(KST) 기준</div>`;
}

/* ---------- 기록: 날짜·시간·게임·당첨자 ---------- */
function viewList(all){
  const rows=all.filter(inPeriod);
  if(!rows.length)return periodChips(all)+`<div class="logempty">이 기간에는 기록이 없어요.</div>`;
  let out='', lastDay='';
  rows.forEach(r=>{
    const k=kst(r.t), day=`${k.y}.${String(k.m).padStart(2,'0')}.${String(k.d).padStart(2,'0')} (${k.w})`;
    if(day!==lastDay){out+=`<div class="logday">${day}</div>`;lastDay=day;}
    out+=`<div class="logrow">
      <span class="lgtime">${k.hh}:${k.mm}</span>
      <span class="lggame">${GAME_EMO[r.g]||'🎲'} ${GAME_NAME[r.g]||r.g}</span>
      <span class="lgname" style="color:${colorOf(r.n)}">${r.n}</span></div>`;
  });
  return periodChips(all)+`<div class="loglist">${out}</div>
    <button id="logClear" class="logclear">기록 전부 지우기</button>`;
}

/* ---------- 월별: 1~12월 최다 당첨자 ---------- */
function viewMonth(all){
  const years=[...new Set(all.map(r=>kst(r.t).y))].sort((a,b)=>b-a);
  const y=years[0];
  const cells=[];
  for(let m=1;m<=12;m++){
    const rows=all.filter(r=>{const k=kst(r.t);return k.y===y&&k.m===m;});
    const t=tally(rows);
    if(!t.length){cells.push(`<div class="mcell off"><div class="mm">${m}월</div><div class="mno">—</div></div>`);continue;}
    const top=t[0], tie=t.filter(x=>x.c===top.c);
    cells.push(`<div class="mcell">
      <div class="mm">${m}월</div>
      <div class="mname" style="color:${colorOf(top.n)}">${tie.length>1?tie.map(x=>x.n).join('·'):top.n}</div>
      <div class="mcnt">${top.c}회 · 총 ${rows.length}회</div></div>`);
  }
  return `<div class="myear">${y}년 — 달마다 가장 많이 걸린 사람</div>
    <div class="mgrid">${cells.join('')}</div>
    <div class="logfoot">한국 시간(KST) 기준 · 동률이면 모두 표시</div>`;
}

function showWinner(name,color,msg,hideName){
  const wn=$("#wName");
  if(hideName){wn.style.display="none";}
  else{wn.style.display="";wn.textContent=name;wn.style.color=color||"#fff";}
  $("#wMsg").textContent=msg||"오늘 커피는 이 분이 쏩니다! ☕";
  $("#winner").classList.add("show");
  musSet(null);                            // BGM 끄고 팡파레만
  confetti(180);fanfare();
  if(navigator.vibrate)navigator.vibrate([40,60,40,60,120]);
}

function renderPlayers(){
  const list=$("#plist");list.innerHTML="";
  players.forEach((p,i)=>{
    const m=multOf(p);
    const row=document.createElement("div");row.className="prow"+(m>1?" multi":"");
    row.innerHTML=`<div class="dot" style="background:${PALETTE[i%PALETTE.length]}"></div>
      <input type="text" value="${(p.name||'').replace(/"/g,'&quot;')}" maxlength="8" placeholder="이름 입력">
      <div class="mul">
        <button class="dec" ${m<=1?"disabled":""}>−</button>
        <span class="n">×${m}</span>
        <button class="inc" ${m>=MAX_MULT?"disabled":""}>+</button>
      </div>
      <button class="rm">✕</button>`;
    row.querySelector("input").oninput=e=>{players[i].name=e.target.value;refreshSlots();};
    /* 곱하기는 사람마다 독립이다 — 총 칸 수로는 막지 않는다(×9까지 자유) */
    row.querySelector(".inc").onclick=()=>{
      players[i].mult=Math.min(MAX_MULT,multOf(players[i])+1);
      savePlayers();renderPlayers();beep(760,.05,"square",.10);
    };
    row.querySelector(".dec").onclick=()=>{
      players[i].mult=Math.max(1,multOf(players[i])-1);
      savePlayers();renderPlayers();beep(430,.05,"square",.09);
    };
    row.querySelector(".rm").onclick=()=>{players.splice(i,1);if(players.length<2)players.push({name:"",mult:1});savePlayers();renderPlayers();};
    list.appendChild(row);
  });
  refreshSlots();
}
/* 사람 수와 '펼친 칸 수'를 같이 보여준다 — ×N을 걸면 두 숫자가 달라진다 */
function refreshSlots(){
  const heads=headCount(), slots=validPlayers().length;
  $("#pchip").textContent=heads+"명";
  const info=$("#slotInfo");
  if(!info)return;
  if(slots>heads)
    info.textContent=`실제 게임 인원 ${slots}칸 (${heads}명)`
                     +(slots>24?" · 칸이 많아 사다리·룰렛은 이름 대신 색으로 표시돼요":"");
  else
    info.textContent=`이름 옆 ＋ 를 누르면 그 사람이 ×2 … ×9 로 늘어나요`;
}

/* canvas helper w/ DPR + resize observer */
function makeStage(host,extraHTML=""){
  const wrap=document.createElement("div");wrap.className="host";
  wrap.innerHTML=`<div class="stage"><canvas></canvas></div>${extraHTML}`;
  host.appendChild(wrap);
  const stage=wrap.querySelector(".stage"),cv=wrap.querySelector("canvas"),ctx=cv.getContext("2d");
  function fit(){const r=stage.getBoundingClientRect();cv.width=Math.round(r.width*devicePixelRatio);
    cv.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    cv._w=r.width;cv._h=r.height;}
  const ro=new ResizeObserver(fit);ro.observe(stage);fit();
  return {wrap,stage,cv,ctx,fit,ro,W:()=>cv._w,H:()=>cv._h};
}

/* ============================================================
   1) 사다리타기  (Ladder)
   ============================================================ */
function Ladder(host,ps){
  const S=makeStage(host,`
    <div class="controls"><button class="bigbtn" id="lgo">🎬 사다리 실행</button></div>
    <div class="hint" id="lhint">아래에 커피 한 잔이 숨어있어요. 위 참가자를 눌러도 시작!</div>`);
  const {ctx,W,H}=S;
  const n=ps.length;
  const ROWS=Math.max(6,n+3);
  let rungs=[],trail=[],anim=null,running=false,winIdx=Math.floor(Math.random()*n);
  const prize=Array.from({length:n},(_,i)=>i===winIdx?"☕":"꽝");
  const played=new Set();          // 이미 타본 참가자
  const doneTrails=[];             // 지나간 경로(흐리게 남김)
  // ★ 도착 칸 계산(기하 계산 없이 순수 논리) — 검증용/결과용 공용
  function walk(start){
    let col=start;
    for(let r=1;r<ROWS;r++){
      if(rungs.some(g=>g.row===r&&g.col===col))col++;
      else if(rungs.some(g=>g.row===r&&g.col===col-1))col--;
    }
    return col;
  }
  function build(){
    // ★ 버그 수정: 같은 행에 가로줄이 '붙어서' 생기면 경로가 겹쳐 도착 칸이 중복되고
    //   ☕ 칸에 아무도 도달하지 못하는 경우가 생김. 같은 행에서는 서로 한 칸 이상 떨어뜨린다.
    for(let attempt=0;attempt<300;attempt++){
      rungs=[];
      for(let r=1;r<ROWS;r++){
        const used=[];
        for(let c=0;c<n-1;c++){
          if(used.some(u=>Math.abs(u-c)<=1))continue;   // 인접 가로줄 금지
          if(Math.random()<0.5){used.push(c);rungs.push({row:r,col:c,ry:r/ROWS});}
        }
      }
      const ends=[];for(let i=0;i<n;i++)ends.push(walk(i));
      // 모든 참가자가 서로 다른 칸에 도착(=1:1 대응)하고, 최소한 섞여 있어야 통과
      if(new Set(ends).size===n && ends.some((e,i)=>e!==i)) return;
    }
  }
  build();

  /* ★ v2.9.3 — 시작 전에 **가로줄을 가리고** 자리 배치를 고르게 한다.
     ① 가림막: 사다리 한가운데(가로줄이 몰린 구간)를 불투명 패널로 덮는다.
        예전엔 들어가자마자 연결이 다 보여서, 눈으로 따라가면 결과를 알 수 있었다.
        위쪽 이름줄과 아래쪽 꽝/☕ 는 일부러 남긴다 — 누가 참가했는지는 봐야 한다.
     ② 그대로 / 랜덤 섞기: 섞기를 고르면 **위 이름표만** 다시 배치한다.
        가로줄(rungs)·당첨칸(winIdx)은 건드리지 않는다 — 그쪽을 섞으면 이미 만들어 둔
        '1:1 대응' 검증이 깨진다. 이름만 섞어도 누가 어디로 갈지는 완전히 바뀐다. */
  let locked=true;                       // 가림막이 떠 있는 동안은 실행 금지
  function askSeats(){
    const ov=document.createElement("div");
    ov.style.cssText=`position:absolute;left:0;right:0;z-index:30;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      padding:18px;text-align:center;background:rgba(10,12,30,.97);
      border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);`;
    /* ★ 덮는 범위를 **그림 좌표에서 계산**한다. 22%~82% 같은 고정 비율로 두면
       ROWS 가 인원에 따라 변해서 맨 위 가로줄 한두 개가 빠져나온다(실제로 12명에서 그랬다).
       세로줄 구간(topY~botY)만 덮고, 그 위 이름표와 아래 꽝/커피는 남긴다. */
    const fitBox=()=>{const h=H();ov.style.top=(h*.16+6)+"px";ov.style.bottom=(h*.14+6)+"px";};
    fitBox();requestAnimationFrame(fitBox);
    addEventListener("resize",fitBox);
    ov._off=()=>removeEventListener("resize",fitBox);
    ov.innerHTML=`
      <div style="font-size:34px;line-height:1;">🔀</div>
      <div style="font-size:18px;font-weight:900;">자리를 정해주세요</div>
      <div style="color:var(--sub);font-size:12px;font-weight:600;line-height:1.5;">
        사다리는 이미 그려져 있어요.<br>가로줄은 시작하면 보여드릴게요 🤫</div>
      <button id="lSame" class="bigbtn" style="max-width:280px;width:100%;margin:0;">➡️ 그대로 — 지금 순서로</button>
      <button id="lShuf" class="bigbtn alt" style="max-width:280px;width:100%;margin:0;">🔀 랜덤 섞기 — 자리 다시</button>`;
    S.stage.appendChild(ov);
    const go=(shuffle)=>{
      if(shuffle){
        for(let i=ps.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=ps[i];ps[i]=ps[j];ps[j]=t;}
        beep(520,.10,"square",.16);setTimeout(()=>beep(760,.12,"square",.16),90);
      }else beep(720,.12,"triangle",.2);
      locked=false;ov._off();ov.remove();
      $("#lhint").textContent=shuffle
        ? "자리를 섞었어요! 위 참가자를 눌러 시작하세요 🔀"
        : "아래에 커피 한 잔이 숨어있어요. 위 참가자를 눌러도 시작!";
    };
    ov.querySelector("#lSame").onclick=()=>go(false);
    ov.querySelector("#lShuf").onclick=()=>go(true);
  }
  askSeats();

  // ★ 양옆 여백 — 12명이 320px 폰에 들어가면 .12(24%)는 너무 낭비라 간격이 22px까지 좁아진다.
  //   인원이 많을 때만 여백을 .08로 줄여 세로줄 간격을 번다.
  function colX(i){const m=W()*(n>8?.08:.12);return m+(W()-2*m)*(i/(n-1||1));}
  function draw(){
    const w=W(),h=H();ctx.clearRect(0,0,w,h);
    const topY=h*.16,botY=h*.86;
    // vertical lines
    /* ★ 이름 알약과 꽝/☕ 글자는 세로줄 간격에 맞춰 줄인다.
       예전엔 알약 52px·이름 12px·꽝 20px 고정이었는데, 320px 폰에 12명이면
       세로줄 간격이 22px라 알약이 서로 30px씩 겹치고 꽝이 붙어서 못 읽었다. */
    const gap=n>1?(colX(1)-colX(0)):w*.5;
    const pw=Math.min(52,Math.max(6,gap-3));                  // 알약 폭
    const nf=clamp(Math.round(pw*.38),8,12);                  // 이름 글자 크기
    const nch=clamp(Math.floor(pw/(nf*.62)),1,4);             // 이름 글자 수
    const pf=clamp(Math.round(gap*.78),9,20);                 // 꽝/☕ 글자 크기
    /* ★ ×N 곱하기 때문에 칸이 40개까지도 온다. 이름을 억지로 밀어 넣으면
       글자가 서로 겹쳐 죽도 밥도 안 되므로, 좁아지는 순서대로 이름 → 알약 →
       바닥 글자를 하나씩 포기하고 '색 막대'로 떨어뜨린다. */
    const showName=pw>=18, showPrize=gap>=13;
    const lw=clamp(gap*0.16,1,3);
    for(let i=0;i<n;i++){const x=colX(i);
      ctx.strokeStyle="rgba(255,255,255,.22)";ctx.lineWidth=lw;
      ctx.beginPath();ctx.moveTo(x,topY);ctx.lineTo(x,botY);ctx.stroke();
      // top name pill (이미 타본 사람은 흐리게)
      ctx.globalAlpha=played.has(i)?0.32:1;
      ctx.fillStyle=ps[i].color;
      ctx.roundRect(x-pw/2,topY-34,pw,showName?24:14,Math.min(10,pw/2));ctx.fill();
      if(showName){
        ctx.fillStyle="#0b0e24";ctx.font="700 "+nf+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(clip(ps[i].name,nch),x,topY-22);
      }
      ctx.globalAlpha=1;
      // bottom prize — 좁으면 글자 대신 점으로
      ctx.textAlign="center";ctx.textBaseline="middle";
      if(showPrize){ ctx.font=pf+"px sans-serif";ctx.fillStyle="#fff";ctx.fillText(prize[i],x,botY+22); }
      else{ const win=prize[i]!=="꽝";
        ctx.fillStyle=win?"#ffd76f":"rgba(255,255,255,.30)";
        ctx.beginPath();ctx.arc(x,botY+14,Math.max(2,gap*0.22),0,6.28);ctx.fill(); }
    }
    // rungs
    ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=Math.max(2,lw+1);ctx.lineCap="round";
    for(const g of rungs){const x1=colX(g.col),x2=colX(g.col+1),y=topY+(botY-topY)*g.ry;
      ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();}
    // 지난 사람들의 경로 (흐리게 남겨서 누가 어디로 갔는지 보이게)
    ctx.globalAlpha=.30;ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";
    for(const dt of doneTrails){
      ctx.strokeStyle=dt.color;ctx.beginPath();ctx.moveTo(dt.pts[0].x,dt.pts[0].y);
      for(let i=1;i<dt.pts.length;i++)ctx.lineTo(dt.pts[i].x,dt.pts[i].y);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    // trail
    if(trail.length>1){ctx.strokeStyle=trail.color;ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";
      ctx.shadowColor=trail.color;ctx.shadowBlur=16;
      ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);
      const pend=Math.min(trail.progress,trail.length);
      for(let i=1;i<pend;i++)ctx.lineTo(trail[i].x,trail[i].y);
      ctx.stroke();ctx.shadowBlur=0;
      const p=trail[Math.min(trail.progress|0,trail.length-1)];
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(p.x,p.y,8,0,6.28);ctx.fill();
      ctx.fillStyle=trail.color;ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.28);ctx.fill();
    }
  }
  function path(start){
    // compute polyline for player 'start'
    const w=W(),h=H(),topY=h*.16,botY=h*.86;
    let col=start;const pts=[{x:colX(col),y:topY}];
    for(let r=1;r<ROWS;r++){
      const y=topY+(botY-topY)*(r/ROWS);
      // move down to this row
      pts.push({x:colX(col),y});
      // check rung to the right (col) or left (col-1)
      const rRight=rungs.find(g=>g.row===r&&g.col===col);
      const rLeft=rungs.find(g=>g.row===r&&g.col===col-1);
      if(rRight){col++;pts.push({x:colX(col),y});}
      else if(rLeft){col--;pts.push({x:colX(col),y});}
    }
    pts.push({x:colX(col),y:botY});
    return {pts,end:col};
  }
  function run(start){
    if(locked||running||played.has(start))return;running=true;played.add(start);$("#lgo").disabled=true;
    const {pts,end}=path(start);
    // densify
    const dense=[];const seg=6;
    for(let i=0;i<pts.length-1;i++){for(let s=0;s<seg;s++){
      dense.push({x:pts[i].x+(pts[i+1].x-pts[i].x)*s/seg,y:pts[i].y+(pts[i+1].y-pts[i].y)*s/seg});}}
    dense.push(pts[pts.length-1]);
    trail=dense;trail.progress=0;trail.color=ps[start].color;trail.length=dense.length;
    /* ★ v2.9.3 — 속도를 **칸 수와 무관하게** 잡는다.
       예전엔 ms당 0.06칸 고정이었는데 ROWS=max(6,n+3) 이라 인원이 늘면 줄도 늘어
       12명이면 한 사람 내려오는 데 4.5초, 12명 다 타면 1분에 가까웠다.
       전체 소요를 RUN_MS 로 고정하면 인원과 상관없이 항상 같은 템포가 된다. */
    /* ★ v2.11.7 — 1500ms → **950ms**. 12명이면 한 판이 그만큼 짧아진다
       (1.88초/명 → 1.30초/명, 12명 기준 약 7초 단축). 발소리 간격도 같이 좁아지므로
       '칸'마다 울리는 tick 은 progress/3 기준을 그대로 두면 된다. */
    const RUN_MS=950, spd=dense.length/RUN_MS;
    let last=performance.now(),lastTick=-1;
    (function step(t){
      const dt=t-last;last=t;trail.progress+=dt*spd;
      /* 발소리는 '칸'마다 — progress 를 %3 으로 재면 속도가 바뀔 때 간격이 들쭉날쭉해진다 */
      const ti=(trail.progress/3)|0;
      if(ti!==lastTick){lastTick=ti;tick(500+Math.random()*300);}
      draw();
      if(trail.progress<dense.length){anim=requestAnimationFrame(step);}
      else{running=false;
        const won=end===winIdx;
        doneTrails.push({pts,color:ps[start].color});
        trail=[];
        if(won)logAdd("ladder",ps[start].name);
        setTimeout(()=>{if(won)showWinner(ps[start].name,ps[start].color,"커피 당첨! 오늘은 이 분이 쏩니다 ☕");
          else{const left=n-played.size;
            $("#lhint").textContent=left>0
              ?`${ps[start].name} 님은 '꽝'! 남은 ${left}명 중에 커피가 있어요.`
              :`${ps[start].name} 님은 '꽝'!`;
            $("#lgo").disabled=left===0;}},220);
      }
    })(performance.now());
  }
  // tap top area to choose a player
  S.cv.addEventListener("pointerdown",e=>{
    if(locked||running)return;const r=S.cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
    if(y<H()*.28){let best=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(colX(i)-x);if(d<bd){bd=d;best=i;}}
      if(bd<40)run(best);}
  });
  // 아직 안 타본 참가자 중에서 랜덤 실행
  $("#lgo").onclick=()=>{const rest=[];for(let i=0;i<n;i++)if(!played.has(i))rest.push(i);
    if(rest.length)run(pick(rest));};
  let raf=null;(function loop(){draw();raf=requestAnimationFrame(loop);})();
  return ()=>{cancelAnimationFrame(raf);cancelAnimationFrame(anim);S.ro.disconnect();};
}

/* ============================================================
   2) 룰렛 돌리기 (Roulette)
   ============================================================ */
function Roulette(host,ps){
  const S=makeStage(host,`
    <div class="controls"><button class="bigbtn alt" id="rgo" disabled>🛑 멈춤</button></div>
    <div class="hint" id="rhint">휠을 <b>잡고 돌리듯</b> 쓸다가 튕기듯 떼세요! 👆💨</div>`);
  const {ctx,W,H}=S;
  const n=ps.length, SEG=6.2832/n;
  let ang=rand(0,6.2832),raf=null;

  /* ★ v2.9.3 — **실제 물리로 도는 룰렛**. 예전(v1.4.3~v2.9.2)은 목표 각도를 미리 뽑고
     7.2초 이징으로 끌고 가서, 당첨자가 돌리기 전에 이미 정해져 있었다.
     이제는 손이 준 각속도가 마찰로 줄다 **멈춘 자리**가 당첨이다.
     ★ v2.9.4 — 입력을 **잡고 돌리기(drag-to-spin)** 로 바꿨다. 아래 입력 주석 참고. */
  /* ★ v2.9.7 — **마찰을 속도에 따라 다르게** 준다.
     예전엔 한 값(0.9915)이라, 아무것도 안 보이는 '흐릿한 고속' 구간이 길고 정작
     핀에 걸리는 게 보이는 저속 구간은 짧았다. 빠를 땐 더 세게 깎고(0.9855) 느릴 땐
     덜 깎아(0.9915), **보이는 구간을 늘리고 안 보이는 구간을 줄인다**.
     최고 속도도 0.54 → 0.40 으로 낮췄다 — 0.54 는 칸당 한 프레임이라 그냥 색이 흐른다. */
  const FR_FAST =0.9855;   // 최고 속도에서의 마찰
  const FR_FREE =0.9915;   // 거의 멈출 때의 마찰(오래 끌어 준다)
  const FR_BRAKE=0.9760;   // 멈춤 버튼 — 즉시가 아니라 3~4초에 걸쳐 스르륵
  const V_MIN   =0.1100, V_MAX=0.4000;   // 출발 속도의 하한·상한
  const LAUNCH_MIN=0.0750; // ★ 손을 뗄 때 이보다 느리면 **출발하지 않는다**
  const GAIN    =2.0;      // 손의 각속도 → 출발 회전력 배율

  /* ★ v2.9.7 — **디텐트(칸 중앙으로 끌어당기는 복원력)를 완전히 들어냈다.**
     v2.9.4~2.9.6 에는 느려지면 칸 한가운데로 당기는 힘이 있었다. 실제 룰렛의
     '바늘이 핀 사이로 떨어져 앉는' 느낌을 노린 것이었는데, 부작용이 컸다:
       ① 멈출 때 **뒤로 되돌아가는 게 눈에 보였다** — 관성으로 도는 물건이 역행하면
          "시스템이 결과를 옮겼다"로 읽힌다.
       ② 항상 칸 정중앙에서 서니 **어디서 멈출지가 아니라 어느 칸인지만** 남았다.
     이제 **손이 준 힘 + 마찰** 말고는 휠을 움직이는 게 아무것도 없다. 각속도는
     부호가 절대 안 바뀌므로 역행이 원리적으로 불가능하고, 멈추는 자리는 순수하게
     얼마나 세게 돌렸는지로 정해진다. 칸 경계에 걸쳐 서면 그것도 정직한 결과다
     (당첨 칸은 `winnerIndex()` 가 바늘 위치로 명확히 가른다). */
  const V_STOP  =0.0020;   // 이보다 느려지면 정지로 친다

  let state="idle",vel=0,spent=false,braking=false;
  let win=-1,zoom=1,hi=-1,holdUntil=0,pulse=0;
  let tense=0,nextHb=0,hbGap=560,ducked=false;
  let ptrRot=0,ptrVel=0;                    // 바늘의 감쇠 스프링(핀에서 놓여난 뒤 떨림)
  let riding=false;                         // ★ v2.9.6 — 지금 핀을 타고 있는 중인가
  let lastSgn=1;                            // 마지막으로 돌던 방향(멈춘 뒤 구속용)
  /* ★ v2.11.0 — 바늘이 얼마나 눕는지는 **상수가 아니라 매 프레임 푸는 값**이다.
     핀과 겹치지 않는 최소 각을 leanFor() 가 이분법으로 찾는다. 그래서 여기엔
     최대 각도, 접촉 폭도, 놓는 시점도 상수가 없다 — 전부 기하가 정한다.
     (v2.9.7~v2.10.0 에는 CW·RIDE_MAX·SNAP 같은 다이얼이 있었는데, 그 근사가
      바로 "핀을 안 넘었는데 떨어지고 되돌아오며 뚫는" 증상의 원인이었다.) */
  let lastT=performance.now();
  /* ★ v2.9.5 — 한 칸 넘을 때마다 터지는 연출들. 전부 1로 튀었다가 스스로 잦아든다.
     칸이 넘어가는 **순간**이 눈에 안 보이면 빠르게 돌 때 그냥 색이 흐르는 것처럼 보인다. */
  let sparks=[];                            // 핀에서 튀는 불꽃
  let segFlash=0;                           // 새로 가리킨 칸이 번쩍
  let hitFlash=0;                           // 접점의 섬광
  let pinPop=-1,pinPopV=0;                  // 방금 맞은 핀이 부풀었다 가라앉는다
  let tipX=0,tipY=0;                        // 바늘 끝(불꽃이 여기서 튄다)
  const smooth=x=>x*x*(3-2*x);
  const hint=t=>{const e=$("#rhint");if(e)e.innerHTML=t;};
  function thump(){                         // 심장박동
    beep(58,.15,"sine",.24);setTimeout(()=>beep(44,.18,"sine",.18),165);
    if(navigator.vibrate)navigator.vibrate(22);
  }
  function geo(){
    const w=W(),h=H();
    const R=Math.min(w,h)*.4*zoom;
    return {w,h,cx:w/2,cy:h/2+(zoom-1)*h*.45,R};
  }
  /* 핀 크기. v2.11.0 에서 .032R → .058R 로 키웠다가 **너무 커 보여서** .036R 로 되돌린다.
     걸리는 구간의 길이는 `핀 크기 + 날 두께`에 비례하므로 짧아지지만,
     v2.11.2 의 '들린 채 버티기' 덕분에 작아도 **뚫리지는 않는다**.
     칸이 많아지면(×N) 핀이 서로 닿지 않게 줄인다. */
  const pinR=R=>Math.max(2.4,Math.min(R*.036,(R*.94)*SEG*0.22));
  /* ★ v2.10.0 — 날의 치수를 한 곳에서 낸다. 예전엔 draw() 와 step() 이 각자
     `56*zoom`, `R-pr*3.6` 을 따로 써서 한쪽만 고치면 조용히 어긋났다.
       tipR = 날 끝 반지름 / pivR = 회전축 반지름
       pinC = 핀 중심 반지름 / armR = 축에서 핀까지의 **날 위 거리**
     걸림은 날 끝이 아니라 **핀 반지름에서** 일어나므로 armR·pinC 로 계산해야 한다. */
  function bladeGeo(R){
    /* ★ v2.11.2 — 날을 **다시 짧고 얇게**. 76×15 는 너무 길고 두꺼웠다.
       원래 요청은 "끝을 더 내려 달라"였지 "길고 두껍게"가 아니었다.
       길이·두께는 v2.9.x 수준(52×11)으로 되돌리되, **끝은 계속 깊이**
       (`R - pr*3.0`) 내려서 핀을 살로 받는 건 유지한다. */
    const pr=pinR(R), LEN=52*zoom, pw=11*zoom;
    const tipR=R-pr*3.0, pivR=tipR+LEN, pinC=R-pr*1.25;
    /* 날 끝이 **핀 바깥면**을 넘어서는 각. 여기를 넘으면 핀이 날 밑으로 빠져나간다 */
    const c=(LEN*LEN+pivR*pivR-(pinC+pr)*(pinC+pr))/(2*pivR*LEN);
    const lift=(c>=1)?0:(c<=-1?Math.PI:Math.acos(c));
    return {pr,LEN,pw,tipR,pivR,pinC,armR:pivR-pinC,lift};
  }
  /* ★ v2.11.1 — 날은 **끝으로 갈수록 가늘어지는 사다리꼴**이다(어깨 pw → 0.54pw → 0.22pw).
     v2.11.0 은 두께를 `pw*0.45` 고정으로 놓고 구속을 풀었는데, 많이 누울수록
     핀이 닿는 지점이 **축 쪽(두꺼운 쪽)으로 올라간다**. 얇다고 계산한 만큼
     실제로는 **날이 핀을 파고들었다**. 이제 닿는 위치의 국소 두께를 쓴다. */
  function halfW(u,pw){
    return u<=0.70 ? pw*(1-0.46*(u/0.70))
                   : pw*(0.54-0.32*((u-0.70)/0.30));
  }
  /* 날 중심선(축→끝 선분)에서 점 C 까지 — {거리, 선분 파라미터} */
  function distBlade(rot,C,b){
    const py=-b.pivR;
    const dx=-b.LEN*Math.sin(rot), dy=b.LEN*Math.cos(rot);
    let t=((C.x)*dx+(C.y-py)*dy)/(dx*dx+dy*dy);
    t=t<0?0:(t>1?1:t);
    return {d:Math.hypot(C.x-dx*t, C.y-(py+dy*t)), t};
  }
  /* 이만큼 누웠을 때 핀과의 **여유**(음수면 파고든 것).
     ★ SAFE=1.0px — 중심선+국소두께는 실제 다각형의 근사라 모서리에서 0.08px 정도
     모자란다. 그 미세한 양도 화면에선 "물렸다"로 보이므로 여유를 둬서
     실측 간격을 **0.91px 이상**으로 띄운다(다각형 전수 검사로 확인). */
  const SAFE=1.0;
  function gapAt(rot,C,b){
    const r=distBlade(rot,C,b);
    return r.d-(b.pr+halfW(r.t,b.pw)+SAFE);
  }
  /* ★ v2.11.3 — **각도를 푸는 방식을 버렸다.**
     v2.11.0~2 는 "핀을 비키려면 몇 도 필요한가"를 이분법으로 풀고, 맨 앞에
     `if(gapAt(0) >= 0) return 0;` 로 **0°에서 안 닿으면 자유**라고 판정했다.
     그런데 바늘은 지금 30° 올라가 있을 수 있다. 핀이 제자리 선을 지나가면
     **0°에선 안 닿지만 30°에선 닿는다** — 그런데도 "자유"가 되어 툭 떨어지고,
     내려오는 길에 핀을 쓸고 지나갔다. 그게 남아 있던 관통이다.
     이제는 각을 풀지 않는다. **지금 각에서 한 칸씩 내려보며 닿기 직전에 멈춘다.**
     즉 닿아 있으면 무조건 걸려 있는 것이고, 날 아랫부분이 핀을 완전히
     지나쳐 길이 열렸을 때에만 내려온다. */
  function clearAt(b,pins,rot){
    for(let i=0;i<pins.length;i++){
      const phi=pins[i];
      const C={x:b.pinC*Math.sin(phi), y:-b.pinC*Math.cos(phi)};
      if(gapAt(rot,C,b)<0) return false;
    }
    return true;
  }
  /* 바늘 원위치(맨 위) 기준 핀의 각 위치. + = 회전이 커지는 쪽 */
  function nearPins(){
    const out=[];
    for(let i=0;i<n;i++){
      let p=(ang+i*SEG+Math.PI/2)%6.2832;
      if(p>Math.PI)p-=6.2832; else if(p<-Math.PI)p+=6.2832;
      if(Math.abs(p)<SEG*1.1) out.push(p);
    }
    return out;
  }
  /* 바늘이 기울어 있을 때, 날이 핀 반지름에서 **원위치보다 얼마나 나가 있는가**(각).
     양수 = 회전이 커지는 쪽. 걸린 채로 멈췄을 때 당첨 칸을 이걸로 보정한다. */
  function bladeOffset(R){
    const b=bladeGeo(R);
    /* ★ v2.11.4 — **날 끝의 실제 각**을 쓴다.
       예전엔 `armR·sin(θ)/pinC` 라는 소각 근사였다. 핀 반지름에서 잰 값이라
       크게 누울수록 실제 끝 위치와 벌어졌다 — 46° 에서 0.186 vs 0.222rad,
       **한 칸(30°)의 7%** 차이다. 경계 근처면 옆 칸이 뽑힌다.
       축 (0,−pivR) 에서 로컬 (0,LEN) 을 ptrRot 만큼 돌린 점의 각이 정답이다. */
    return Math.atan2(-b.LEN*Math.sin(ptrRot), b.pivR-b.LEN*Math.cos(ptrRot));
  }
  /* 바늘이 실제로 가리키는 칸 (offset 을 반영) */
  function winnerAt(off){
    let a=(-Math.PI/2+off-ang)%6.2832;if(a<0)a+=6.2832;
    return Math.floor(a/SEG)%n;
  }
  /* 바늘이 지금 칸 안 어디에 있나. 0 = 방금 넘은 핀, 1 = 다음 핀, 0.5 = 칸 한가운데 */
  function segFrac(){let a=(-Math.PI/2-ang)%SEG;if(a<0)a+=SEG;return a/SEG;}

  function draw(){
    const {w,h,cx,cy,R}=geo();
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<n;i++){
      const a0=ang+i*SEG,a1=ang+(i+1)*SEG;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
      ctx.fillStyle=ps[i].color;
      if(i===hi){
        /* ★ v2.9.5 — 새로 가리킨 칸이 **번쩍**한다(segFlash). 이게 없으면 빠르게 돌 때
           칸이 넘어가는 순간이 안 보이고 색이 그냥 흐르는 것처럼 읽힌다. */
        const glow=state==="hold"?.55+.45*Math.sin(pulse):(.22+.40*segFlash);
        ctx.fill();
        ctx.save();ctx.globalAlpha=glow;ctx.fillStyle="#fff";ctx.fill();ctx.restore();
      }else ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=n>28?1:2;ctx.stroke();
      if(R*0.86*SEG>=13){
        ctx.save();ctx.translate(cx,cy);ctx.rotate((a0+a1)/2);ctx.textAlign="right";ctx.textBaseline="middle";
        ctx.fillStyle="#0b0e24";ctx.font=(i===hi?"900 ":"800 ")+clamp(Math.min(R*.12,R*0.86*SEG*0.72),9,22)+"px sans-serif";
        ctx.fillText(clip(ps[i].name,6),R*.86,0);ctx.restore();
      }
    }
    if(state==="hold"&&win>=0){
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang+win*SEG,ang+(win+1)*SEG);ctx.closePath();
      ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.shadowColor="#fff";ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
    }
    /* ★ 흰 핀 — 칸 경계마다 하나씩, 휠과 **같이 돈다**. 바늘이 여기 걸려 '다다다닥' 한다. */
    const pr=pinR(R);
    for(let i=0;i<n;i++){
      const a=ang+i*SEG, px=cx+Math.cos(a)*(R-pr*1.25), py=cy+Math.sin(a)*(R-pr*1.25);
      /* ★ v2.9.5 — 방금 맞은 핀은 부풀었다 가라앉는다. 어느 핀에 걸렸는지가 보인다 */
      const pop=(i===pinPop)?1+1.15*pinPopV:1;
      ctx.beginPath();ctx.arc(px,py,pr*pop,0,6.28);
      ctx.fillStyle="#fff";
      ctx.shadowColor=(i===pinPop&&pinPopV>.05)?"rgba(255,226,140,1)":"rgba(255,255,255,.85)";
      ctx.shadowBlur=pr*(2.2+5.0*(i===pinPop?pinPopV:0));
      ctx.fill();ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(px-pr*.28,py-pr*.28,pr*.38*pop,0,6.28);
      ctx.fillStyle="rgba(255,255,255,.95)";ctx.fill();
    }
    // hub
    ctx.beginPath();ctx.arc(cx,cy,R*.16,0,6.28);ctx.fillStyle="#fff";ctx.fill();
    ctx.fillStyle="#0b0e24";ctx.font="700 "+clamp(R*.1,12,20)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("☕",cx,cy);
    if(tense>.01){
      const vg=ctx.createRadialGradient(cx,cy,R*.5,cx,cy,Math.max(w,h)*.8);
      vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,`rgba(0,0,0,${.74*tense})`);
      ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
    }
    /* ★ v2.9.4 — 바늘(플래퍼) 위치를 다시 잡았다.
       예전엔 축이 R+6, 길이 20 이라 **끝이 반지름 R-22 까지 파고들어** 핀을 뚫고
       지나가는 그림이었다. 이제 축을 밖으로 빼고 길이를 줄여 **끝이 딱 핀에 닿는다**:
         축  = R + LEN - pr*0.6   (예전보다 위로 올라간다)
         끝  = R - pr*0.6         (핀 바깥면을 살짝 파고드는 지점)
       회전축이 끝이 아니라 **위쪽 꼭지**라서, 젖혀지면 끝이 좌우로 크게 흔들린다. */
    /* ★ v2.9.5 — 바늘을 **확 키우고 핀을 물게** 했다.
       v2.9.4 는 끝을 `R - pr*0.6`(핀 바깥면)에 뒀더니 **끝만 간신히 스치는** 그림이라
       "걸린다"가 아니라 "지나간다"로 읽혔다. 끝을 핀 중심보다 안쪽(`R - pr*2.2`)까지
       내려 **핀을 물고 밀어내는** 깊이를 준다. 길이·폭도 22/11 → 38/16.
       축(pivR)은 끝에서 LEN 만큼 위 — 축이 밖에 있어야 젖힐 때 끝이 크게 휘둘린다. */
    /* ★ 날 치수는 bladeGeo() 한 곳에서 — ride 계산과 반드시 같은 값이어야 한다.
       LEN 38 → 56 → **72**: 길수록 축에서 핀까지의 팔(armR)이 길어져,
       같은 각도로 누워도 **핀을 더 멀리까지 따라간다** = 더 오래 걸려 있다. */
    const {LEN,pw,tipR,pivR}=bladeGeo(R);
    /* ★ v2.9.9 — 끝을 **뭉툭한 패들**로. 바늘 끝이 한 점이면 핀과 닿는 면적이 0 이라
       아무리 깊이 넣어도 '걸렸다'가 안 보인다. 실제 룰렛 플래퍼도 주걱 모양이다. */
    const blade=()=>{ctx.beginPath();
      ctx.moveTo(-pw,0);ctx.lineTo(pw,0);
      ctx.lineTo(pw*.54,LEN*.70);ctx.lineTo(pw*.22,LEN);
      ctx.lineTo(-pw*.22,LEN);ctx.lineTo(-pw*.54,LEN*.70);
      ctx.closePath();};
    ctx.save();ctx.translate(cx,cy-pivR);ctx.rotate(ptrRot);
    // ① 바닥 그림자 — 젖혀진 쪽 반대로 살짝 밀어 입체감을 준다
    ctx.save();ctx.translate(ptrRot*4*zoom,2.5*zoom);
    blade();ctx.fillStyle="rgba(0,0,0,.32)";ctx.fill();ctx.restore();
    // ② 본체 — 왼쪽 위가 밝고 오른쪽 아래로 진해지는 사선 그라디언트(플라스틱 느낌)
    const bg=ctx.createLinearGradient(-pw,0,pw,LEN);
    bg.addColorStop(0,"#ff9db0");bg.addColorStop(.42,"#ff4d6d");bg.addColorStop(1,"#b3143f");
    blade();ctx.fillStyle=bg;ctx.shadowColor="#ff4d6d";ctx.shadowBlur=12+18*tense;ctx.fill();ctx.shadowBlur=0;
    // ③ 테두리 — 어두운 선이 있어야 배경 위에서 형태가 끊긴다
    blade();ctx.strokeStyle="rgba(74,8,26,.80)";ctx.lineWidth=Math.max(1,1.1*zoom);ctx.stroke();
    // ④ 하이라이트 — 왼쪽 면을 따라 흐르는 가는 광택 띠
    ctx.beginPath();
    ctx.moveTo(-pw*.66,pw*.22);ctx.lineTo(-pw*.30,LEN*.80);
    ctx.lineTo(-pw*.10,LEN*.76);ctx.lineTo(-pw*.38,pw*.20);
    ctx.closePath();ctx.fillStyle="rgba(255,255,255,.42)";ctx.fill();
    ctx.restore();
    /* ⑤ 회전축 볼트 — 바늘이 **여기 매달려 흔들린다**는 게 보여야 젖힘이 읽힌다.
       금속 링(방사형 그라디언트) + 가운데 나사 머리 */
    const hg=ctx.createRadialGradient(cx-pw*.22,cy-pivR-pw*.22,1,cx,cy-pivR,pw*.55);
    hg.addColorStop(0,"#ffffff");hg.addColorStop(.58,"#e7edf6");hg.addColorStop(1,"#94a1b5");
    ctx.beginPath();ctx.arc(cx,cy-pivR,pw*.55,0,6.28);ctx.fillStyle=hg;ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.34)";ctx.lineWidth=Math.max(1,zoom);ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy-pivR,pw*.18,0,6.28);ctx.fillStyle="#6b7789";ctx.fill();

    /* ★ v2.9.5 — 바늘 끝 위치를 기억해 둔다. 불꽃이 여기서 튄다.
       축 (cx, cy-pivR) 에서 로컬 (0,LEN) 을 ptrRot 만큼 돌린 점. */
    tipX=cx-Math.sin(ptrRot)*LEN;
    tipY=(cy-pivR)+Math.cos(ptrRot)*LEN;

    // 접점 섬광 — 맞는 순간 하얗게 터졌다 사라진다
    if(hitFlash>.02){
      const fr2=hitFlash;
      const rg=ctx.createRadialGradient(tipX,tipY,0,tipX,tipY,pr*7*fr2+4);
      rg.addColorStop(0,`rgba(255,255,255,${.95*fr2})`);
      rg.addColorStop(.35,`rgba(255,226,140,${.55*fr2})`);
      rg.addColorStop(1,"rgba(255,200,80,0)");
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(tipX,tipY,pr*7*fr2+4,0,6.28);ctx.fill();
    }
    // 불꽃 — 짧은 선으로 그려야 '튄다'로 보인다(점으로 그리면 먼지처럼 보인다)
    if(sparks.length){
      ctx.lineCap="round";
      for(const sp of sparks){
        ctx.globalAlpha=clamp(sp.life,0,1);
        ctx.strokeStyle=sp.c;ctx.lineWidth=Math.max(1,pr*.42*sp.life);
        ctx.beginPath();ctx.moveTo(sp.x,sp.y);
        ctx.lineTo(sp.x-sp.vx*2.2,sp.y-sp.vy*2.2);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    // 아직 안 돌렸으면 안내를 깜빡인다
    if(state==="idle"){
      ctx.globalAlpha=.55+.25*Math.sin(performance.now()/380);
      ctx.font="600 13px sans-serif";ctx.fillStyle="#fff";ctx.textAlign="center";
      ctx.fillText("휠을 잡고 돌리듯 쓸어요 ↻",cx,cy+R+34);
      ctx.globalAlpha=1;
    }
  }
  function winnerIndex(){
    let a=(-Math.PI/2-ang)%6.2832;if(a<0)a+=6.2832;
    return Math.floor(a/SEG)%n;
  }
  /* 바늘이 핀을 넘었을 때. cnt=이번 프레임에 지나간 핀 개수(빠르면 2~3개씩 스친다) */
  /* 바늘 바로 아래(꼭대기)에 있는 핀 번호 — 불꽃·팝을 그 핀에 붙이려고 찾는다 */
  function nearestPin(){
    let best=0,bd=9;
    for(let i=0;i<n;i++){
      let d=Math.abs(((ang+i*SEG+Math.PI/2+Math.PI)%6.2832+6.2832)%6.2832-Math.PI);
      if(d<bd){bd=d;best=i;}
    }
    return best;
  }
  /* ★ v2.9.8 — 소리·불꽃은 **바늘이 핀에서 놓여나는 순간**에 낸다.
     v2.9.7 까지는 '칸 경계가 바늘 원위치를 지날 때' 냈는데, 그때 바늘은 아직
     핀을 붙잡고 한창 밀려 올라가는 중이다. 소리가 먼저 나고 모션이 나중에 와서
     둘이 따로 놀았다. 실제로도 "탁" 소리는 플래퍼가 핀을 놓치고 내려칠 때 난다. */
  function pinRelease(cnt){
    const spd=clamp(Math.abs(vel)/V_MAX,0,1);
    for(let k=0;k<cnt;k++) pinHit(spd,k*0.018);
    hitFlash=1; pinPop=nearestPin(); pinPopV=1;
    const dir=(vel>0?0:Math.PI);                       // 튀는 쪽 = 회전 방향
    const cnt2=2+Math.round(spd*5);
    for(let i=0;i<cnt2;i++){
      const a=dir+rand(-0.75,0.75)-0.30;               // 살짝 위로 흩어진다
      const v=(1.1+spd*3.6)*rand(0.55,1.45);
      if(sparks.length<90)
        sparks.push({x:tipX,y:tipY,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,
                     c:Math.random()<.45?"#ffd166":"#fff"});
    }
    if(navigator.vibrate&&spd<.25)navigator.vibrate(14);
  }
  function launch(v,label){
    if(spent||state!=="idle")return;
    spent=true;state="spin";
    vel=v;
    $("#rgo").disabled=false;
    tense=0;nextHb=0;hbGap=560;ducked=false;
    const pct=Math.round(100*(Math.abs(vel)-V_MIN)/(V_MAX-V_MIN));
    hint(`${label} ${pct>72?"엄청 세게":pct>38?"힘차게":"살짝"} 돌렸어요! 🎯`);
    beep(300+420*clamp(Math.abs(vel)/V_MAX,0,1),.10,"triangle",.16);
  }

  /* ---- 입력: 잡고 돌리기(drag-to-spin) --------------------------------
     ★ v2.9.4 — 예전엔 가로 이동량(dx)만 봐서 **휠 위쪽에서 좌우로 쓸 때만** 제대로
     돌고, 양옆에서 위아래로 쓸면 거의 안 먹었다. 이제 손가락의 **중심 기준 각도**를
     따라가므로 위·아래·대각선 어디서 어떻게 쓸어도 실제 휠처럼 돌아간다.

       · 잡고 있는 동안:  휠이 손을 1:1로 따라 돈다. 핀 소리도 나고 바늘도 젖혀지지만
                        **이건 아직 '돌린 것'이 아니다** — state 는 idle 그대로고
                        당첨도 정해지지 않는다.
       · 손을 뗄 때:     마지막 120ms 의 각속도를 본다. LAUNCH_MIN 이상이면 그제야
                        출발(spin). 살살 놓으면 **출발하지 않고** 그 자리에 선다.
       · 돌린 뒤:        어떤 터치도 안 먹는다. 잡아서 멈추거나 더 돌릴 수 없다 —
                        이게 없으면 원하는 칸에서 손으로 잡아 결과를 고를 수 있다.
     축 근처(r < R*0.15)는 각도가 폭주하므로 그 구간의 이동은 버린다. */
  let dragging=false,dragPrev=0,dragTotal=0,dragSamples=null;
  const localPt=e=>{const r=S.cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()};};

  S.cv.addEventListener("pointerdown",e=>{
    if(spent||state!=="idle")return;        // ★ 한 판에 한 번 — 그 뒤 터치는 전부 무시
    try{S.cv.setPointerCapture(e.pointerId);}catch(err){}
    const g=geo(),p=localPt(e);
    dragging=true;dragPrev=Math.atan2(p.y-g.cy,p.x-g.cx);dragTotal=0;
    dragSamples=[{rot:0,t:p.t}];
    hint("잡고 돌리는 중… 손을 <b>튕기듯</b> 떼면 출발! 👆💨");
  });
  S.cv.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const g=geo(),p=localPt(e);
    const a=Math.atan2(p.y-g.cy,p.x-g.cx);
    let d=a-dragPrev;
    while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832;
    dragPrev=a;
    if(Math.hypot(p.x-g.cx,p.y-g.cy)<g.R*0.15)return;   // 축 근처는 버린다
    const prev=dragSamples[dragSamples.length-1];
    vel=(d/Math.max(1,p.t-prev.t))*16.667;              // 핀 소리·바늘 젖힘이 쓰는 순간 속도
    ang+=d;dragTotal+=d;
    dragSamples.push({rot:dragTotal,t:p.t});
    if(dragSamples.length>8)dragSamples.shift();
  });
  const release=()=>{
    if(!dragging)return;
    dragging=false;
    const smp=dragSamples;dragSamples=null;
    vel=0;
    if(spent||state!=="idle")return;
    if(!smp||smp.length<2){hint("휠을 <b>잡고 돌리듯</b> 쓸어주세요 ↻");return;}
    const last=smp[smp.length-1];
    let first=smp[0];
    for(const sp of smp) if(last.t-sp.t<=120){first=sp;break;}
    const dtms=Math.max(8,last.t-first.t);
    const w=((last.rot-first.rot)/dtms)*16.667*GAIN;    // rad/frame
    if(Math.abs(w)<LAUNCH_MIN){
      hint("살살 놓으면 안 돌아가요 — <b>튕기듯</b> 떼주세요! 👆💨");return;
    }
    const v0=Math.sign(w)*clamp(Math.abs(w),V_MIN,V_MAX);
    launch(v0, v0>0?"시계방향으로":"반시계방향으로");
  };
  S.cv.addEventListener("pointerup",release);
  S.cv.addEventListener("pointercancel",release);

  $("#rgo").onclick=()=>{
    if(state!=="spin")return;
    braking=true;$("#rgo").disabled=true;
    hint("브레이크! 🛑 스르륵 멈춥니다…");
    beep(180,.18,"sawtooth",.14);
  };

  function step(ts){
    const dt=clamp(ts-lastT,1,50);lastT=ts;
    const f=dt/16.667;                                   // 60fps 기준 프레임 수
    if(state==="spin"){
      const before=ang;
      /* ★ v2.9.7 — 마찰만으로 감속한다. 인위적인 힘은 **없다**.
         빠를수록 세게 깎아(FR_FAST) 안 보이는 고속 구간을 줄이고,
         느려질수록 덜 깎아(FR_FREE) 핀에 걸리는 게 보이는 구간을 늘린다. */
      const sp0=clamp(Math.abs(vel)/V_MAX,0,1);

      /* ★ v2.11.6 — v2.11.5 에서 "바늘이 똑바로 앉을 때까지 안 멈춘다"를 넣었다가

           `bladeOffset()` 만큼 옆으로 가 있다. 그 상태에서 원위치 기준으로 칸을
           고르면 **화면에 보이는 바늘과 발표되는 당첨자가 다르다**.
           눕지 않았을 때는 offset 이 0 이라 예전과 완전히 같은 결과가 나온다. */
        vel=0;state="hold";win=winnerAt(bladeOffset(geo().R));hi=win;pulse=0;holdUntil=ts+1100;
        beep(150,.10,"sine",.20);setTimeout(()=>beep(880,.12,"triangle",.18),110);   // 툭 → 딩
        musDuck(1,.1);ptrVel-=.22;hint("멈췄다!");
        $("#rgo").disabled=true;
      }
    }else if(state==="hold"){
      /* ★ v2.11.4 — **당첨 칸을 hold 내내 다시 읽는다.**
         예전엔 `|vel| < V_STOP` 이 되는 **그 순간** 한 번만 확정했다. 그런데 바늘은
         그 뒤로도 1.1초 동안 핀에서 내려앉으며 움직인다 — 46° 에 걸려 있다가

    {
